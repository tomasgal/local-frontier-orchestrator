name: G2 v9.7-dev deterministic gate
on:
  push:
    branches: [v9.7-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with: {persist-credentials: false}
      - name: Parse PowerShell and validate registry
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $targets=@('LFO.ps1','install/Install-LFO.ps1','src/QwenChat.ps1','src/LfoEpistemicController.ps1','src/epistemic/VerificationClaim.ps1','src/epistemic/ConfirmationSeeking.ps1','src/epistemic/ResponseStance.ps1','src/LfoG2ComputePolicy.ps1','src/LfoG2Intervention.ps1','tests/Test-LfoG2Intervention.ps1','tests/Test-LfoG2ComputePolicy.ps1','research/Invoke-LfoG2Pilot.ps1','tests/Test-LfoG2Controller.ps1','config/EpistemicRegistry.psd1','src/LfoConfiguration.ps1','src/LfoConfigurationTui.ps1','lfo-config.ps1','tests/Test-LfoConfiguration.ps1')
          foreach($target in $targets){$t=$null;$e=$null;[void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $target),[ref]$t,[ref]$e);if($e.Count){$e|Out-Host;throw "Parse failed: $target"}}
      - name: G2 contract
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-LfoG2Controller.ps1
          if($LASTEXITCODE -ne 0){throw 'G2 contract failed'}
      - name: Configuration contract
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-LfoConfiguration.ps1
          if($LASTEXITCODE -ne 0){throw 'Configuration contract failed'}
      - name: Inherited research and UMA regression
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-ResearchToolingV965.ps1
          if($LASTEXITCODE -ne 0){throw 'Research regression failed'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-LfoUmaBootstrapContract.ps1
          if($LASTEXITCODE -ne 0){throw 'UMA regression failed'}

      - name: G2 exploratory replay export smoke
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File research/Invoke-LfoG2Pilot.ps1 -RepositoryRoot $PWD -OutputRoot $env:RUNNER_TEMP -OfflineOnly -Pilot2
          if($LASTEXITCODE -ne 0){throw 'G2 replay export failed'}

      - name: G2 frozen detector robustness and interaction replay
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File research/Invoke-LfoG2Pilot.ps1 -RepositoryRoot $PWD -OutputRoot $env:RUNNER_TEMP -OfflineOnly -Pilot6
          if($LASTEXITCODE -ne 0){throw 'G2 Pilot 06 replay export failed'}

      - name: G2 compute and intervention contract
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-LfoG2ComputePolicy.ps1
          if($LASTEXITCODE -ne 0){throw 'G2 compute contract failed'}

      - name: G2 cascade contract
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-LfoG2Intervention.ps1
          if($LASTEXITCODE -ne 0){throw 'G2 cascade contract failed'}

      - name: Quality screen offline request contract
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File research/Invoke-LfoG2QualityScreen.ps1 -DryRun -OutputRoot $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Quality screen contract failed'}
